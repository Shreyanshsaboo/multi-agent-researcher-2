# Render blueprint: one web service built from the Dockerfile.
# Deploy: https://render.com/deploy?repo=https://github.com/Shreyanshsaboo/multi-agent-researcher-2
# Render asks for GROQ_API_KEY when the blueprint is created; it is never stored in the repository.
services:
  - type: web
    name: multi-agent-researcher-2
    runtime: docker
    plan: free
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: GROQ_API_KEY
        sync: false
      - key: MAX_ACTIVE_RUNS
        value: "1"
