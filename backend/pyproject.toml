[project]
name = "multi-agent-researcher"
version = "0.2.0"
description = "Six cooperating LLM agents that research a topic and produce a cited, peer-reviewed report."
requires-python = ">=3.11"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
