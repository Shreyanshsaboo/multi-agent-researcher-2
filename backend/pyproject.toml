[project]
name = "multi-agent-researcher"
version = "0.2.0"
description = "Six cooperating LLM agents that research a topic and produce a cited, peer-reviewed report."
requires-python = ">=3.11"

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
# Word lists such as the stopwords read better as one string than as a list literal.
ignore = ["SIM905"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
filterwarnings = ["ignore:nltk is not installed:UserWarning"]
